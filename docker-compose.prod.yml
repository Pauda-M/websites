# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds ACME (Let's Encrypt) certificates and stops publishing database ports
# on the host. Requires PB_DOMAIN to resolve publicly and PB_ACME_EMAIL set.

services:
  traefik:
    # `command` is replaced (not merged) by the overlay, so the full base flag
    # set is restated here plus the ACME resolver — this is why the ACME email
    # actually takes effect (a stray --certificatesresolvers flag alongside a
    # --configfile would be silently ignored).
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=pb-edge"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--api.dashboard=false"
      - "--certificatesresolvers.letsencrypt.acme.email=${PB_ACME_EMAIL:?set in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

  postgres:
    # `!override` clears the merged list — a plain `ports: []` would be merged
    # with the base and leave the host binding in place.
    ports: !override []

  redis:
    ports: !override []

  api:
    environment:
      PB_ENVIRONMENT: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${PB_DOMAIN:?set in .env}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=compress@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.routers.api-metrics.rule=Host(`api.${PB_DOMAIN:?set in .env}`) && PathPrefix(`/metrics`)"
      - "traefik.http.routers.api-metrics.entrypoints=websecure"
      - "traefik.http.routers.api-metrics.tls=true"
      - "traefik.http.routers.api-metrics.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-metrics.priority=100"
      - "traefik.http.routers.api-metrics.middlewares=internal-only@file"
      - "traefik.http.routers.api-metrics.service=api"

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://api.${PB_DOMAIN:?set in .env}
    environment:
      NEXT_PUBLIC_API_URL: https://api.${PB_DOMAIN:?set in .env}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${PB_DOMAIN:?set in .env}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=security-headers@file,compress@file"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
