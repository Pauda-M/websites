# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds ACME (Let's Encrypt) certificates and stops publishing database ports
# on the host. Requires PB_DOMAIN to resolve publicly and PB_ACME_EMAIL set.

services:
  traefik:
    command:
      - "--configfile=/etc/traefik/traefik.yml"
      - "--certificatesresolvers.letsencrypt.acme.email=${PB_ACME_EMAIL:?set in .env}"

  postgres:
    ports: []

  redis:
    ports: []

  api:
    environment:
      PB_ENVIRONMENT: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${PB_DOMAIN:?set in .env}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=compress@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  web:
    environment:
      NEXT_PUBLIC_API_URL: https://api.${PB_DOMAIN:?set in .env}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${PB_DOMAIN:?set in .env}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=security-headers@file,compress@file"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
