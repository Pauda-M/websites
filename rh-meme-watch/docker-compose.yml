services:
  rh-meme-watch:
    image: ghcr.io/pauda-m/rh-meme-watch:latest
    container_name: rh-meme-watch
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - rh_meme_watch_data:/data
    ports:
      # dashboard, host-local only; front it with nginx/tailscale to expose it
      - "127.0.0.1:8087:8080"
    mem_limit: 128m

volumes:
  rh_meme_watch_data:
