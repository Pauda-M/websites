# CI for the standalone Pauda-M/rh-meme-watch repository:
# on push to main -> run tests, then build and push the image to GHCR.
# Uses only the ephemeral GITHUB_TOKEN (no PAT).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure a fixture exists (normally committed; seed as last resort)
        run: test -f tests/fixture_robinhood_pools.json || python scripts/make_seed_fixture.py
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pauda-m/rh-meme-watch:latest
            ghcr.io/pauda-m/rh-meme-watch:${{ github.sha }}
