[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rh-meme-watch"
version = "0.1.0"
description = "Robinhood Chain new-pool Telegram alerter (GeckoTerminal polling, stock-paired meme detection)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["rh_meme_watch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
